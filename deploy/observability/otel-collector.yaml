# OpenTelemetry Collector (local log pipeline). The app, the aws-mock and
# sns-logger push OTLP/HTTP JSON here; it forwards to VictoriaLogs as OTLP
# protobuf. On AWS the same role is played by the CloudWatch agent (journald ->
# CloudWatch Logs); a collector could also export there instead.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  otlphttp/victorialogs:
    logs_endpoint: http://victorialogs:9428/insert/opentelemetry/v1/logs
    headers:
      # one log stream per service
      VL-Stream-Fields: service.name
    compression: gzip

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/victorialogs]
