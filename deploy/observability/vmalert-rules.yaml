# Generated by scripts/sync-alert-rules.js from backend/src/alerts/catalogue.js. Do not edit.
# vmalert evaluates each rule every 15 s over the window written in the query
# (_time:...), on the logs the OpenTelemetry Collector ships to VictoriaLogs.
groups:
  - name: secure-notes
    type: vlogs
    interval: 15s
    rules:
      - alert: config.unsafe
        expr: 'service.name:="secure-notes" event:="config.unsafe" _time:5m | stats count() as n | filter n:>=1'
        labels:
          severity: critical
        annotations:
          title: 'App refused to start: unsafe configuration'
          action: 'Read the log line: it lists each problem (a credential in the environment, a missing secret name, a lab flag in production). Fix the unit or ConfigMap and restart.'
          rule: 'at least 1 in 5m'
          runbook: 'https://github.com/ephico2real2/aws-secrets-manager-node-poc/blob/main/docs/reference/alerts.md#configunsafe'
      - alert: secrets.load.fatal
        expr: 'service.name:="secure-notes" event:="secrets.load.fatal" _time:5m | stats count() as n | filter n:>=1'
        labels:
          severity: critical
        annotations:
          title: 'App could not load its credentials and exited'
          action: 'Check the role can reach Secrets Manager (VPC endpoint, IAM, KMS) and that the secret names resolve. The app is down until it can read them.'
          rule: 'at least 1 in 5m'
          runbook: 'https://github.com/ephico2real2/aws-secrets-manager-node-poc/blob/main/docs/reference/alerts.md#secretsloadfatal'
      - alert: secrets.fetch.failed
        expr: 'service.name:="secure-notes" event:="secrets.fetch.failed" _time:5m | stats count() as n | filter n:>=1'
        labels:
          severity: critical
        annotations:
          title: 'A credential could not be read from Secrets Manager'
          action: 'Check IAM, the VPC endpoint, KMS and the secret name in the log line. If the line says cached=true (a forced refresh failed), the app keeps serving the value it holds until that is SECRET_MAX_STALE_SECONDS old; with cached=false, requests that need this credential are failing now.'
          rule: 'at least 1 in 5m'
          runbook: 'https://github.com/ephico2real2/aws-secrets-manager-node-poc/blob/main/docs/reference/alerts.md#secretsfetchfailed'
      - alert: secrets.fetch.stale
        expr: 'service.name:="secure-notes" event:="secrets.fetch.stale" _time:10m | stats count() as n | filter n:>=3'
        labels:
          severity: warning
        annotations:
          title: 'Serving a cached credential: Secrets Manager unreachable'
          action: 'The app keeps working on the last good value for up to SECRET_MAX_STALE_SECONDS. Find out why refreshes fail before that runs out.'
          rule: 'at least 3 in 10m'
          runbook: 'https://github.com/ephico2real2/aws-secrets-manager-node-poc/blob/main/docs/reference/alerts.md#secretsfetchstale'
      - alert: agent.forbidden
        expr: 'service.name:="secure-notes" event:="agent.forbidden" _time:5m | stats count() as n | filter n:>=1'
        labels:
          severity: critical
        annotations:
          title: 'The local credentials agent refused the app'
          action: 'The agent answered 403: the app is not sending its SSRF token, or the token file is unreadable. Check the token file and group membership. Logged at once, even while a cached value is still served.'
          rule: 'at least 1 in 5m'
          runbook: 'https://github.com/ephico2real2/aws-secrets-manager-node-poc/blob/main/docs/reference/alerts.md#agentforbidden'
      - alert: db.auth.rejected
        expr: 'service.name:="secure-notes" event:="db.auth.rejected" _time:5m | stats count() as n | filter n:>=3'
        labels:
          severity: warning
        annotations:
          title: 'Postgres rejected the cached password'
          action: 'Usually a rotation the app recovers from by itself (look for db.auth.recovered). Repeated rejections mean the secret and the database disagree.'
          rule: 'at least 3 in 5m'
          runbook: 'https://github.com/ephico2real2/aws-secrets-manager-node-poc/blob/main/docs/reference/alerts.md#dbauthrejected'
      - alert: cache.auth.rejected
        expr: 'service.name:="secure-notes" event:="cache.auth.rejected" _time:5m | stats count() as n | filter n:>=3'
        labels:
          severity: warning
        annotations:
          title: 'Redis rejected the cached password'
          action: 'Usually a rotation the app recovers from by itself (look for cache.auth.recovered). Repeated rejections mean the secret and the Redis user disagree.'
          rule: 'at least 3 in 5m'
          runbook: 'https://github.com/ephico2real2/aws-secrets-manager-node-poc/blob/main/docs/reference/alerts.md#cacheauthrejected'
      - alert: cache.refresh.failed
        expr: 'service.name:="secure-notes" event:="cache.refresh.failed" _time:5m | stats count() as n | filter n:>=1'
        labels:
          severity: critical
        annotations:
          title: 'Redis credential refresh failed'
          action: 'Redis rejected the password and the app could not read a new one. Check Secrets Manager access and the rotation function.'
          rule: 'at least 1 in 5m'
          runbook: 'https://github.com/ephico2real2/aws-secrets-manager-node-poc/blob/main/docs/reference/alerts.md#cacherefreshfailed'
      - alert: secrets.reveal.enabled
        expr: 'service.name:="secure-notes" event:="secrets.reveal.enabled" _time:5m | stats count() as n | filter n:>=1'
        labels:
          severity: warning
        annotations:
          title: 'Secret values are being written to the log (lab flag on)'
          action: 'LOG_REVEAL_SECRETS=true is for labs. Turn it off and treat the values in this log as exposed.'
          rule: 'at least 1 in 5m'
          runbook: 'https://github.com/ephico2real2/aws-secrets-manager-node-poc/blob/main/docs/reference/alerts.md#secretsrevealenabled'
      - alert: rotation.demo.failed
        expr: 'service.name:="secure-notes" event:="rotation.demo.failed" _time:5m | stats count() as n | filter n:>=1'
        labels:
          severity: warning
        annotations:
          title: 'A demo rotation failed'
          action: 'Demo only. The log line names the step that failed.'
          rule: 'at least 1 in 5m'
          runbook: 'https://github.com/ephico2real2/aws-secrets-manager-node-poc/blob/main/docs/reference/alerts.md#rotationdemofailed'
      - alert: app.errors.burst
        expr: 'service.name:="secure-notes" level:=error -_msg:~"^simulated:" _time:5m | stats count() as n | filter n:>=5'
        labels:
          severity: warning
        annotations:
          title: 'Burst of errors in the app log'
          action: 'Look at the error lines in the log store for the same five minutes.'
          rule: 'at least 5 in 5m'
          runbook: 'https://github.com/ephico2real2/aws-secrets-manager-node-poc/blob/main/docs/reference/alerts.md#apperrorsburst'
