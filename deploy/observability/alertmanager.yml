# Alertmanager (local): alerts from vmalert -> the local SNS (sns-logger), as
# Alertmanager would publish to Amazon SNS. Routing matches the AWS alarms:
# critical -> the paging topic (email, SMS, chat), the rest -> the chat topic.
# Resolved notifications are not sent locally (send_resolved: false): an
# Alertmanager receiver can't send "resolved" to a different topic than
# "firing". On AWS the alarm's OK goes to the chat topic only.
#
# One message serves every protocol here (Alertmanager has no per-protocol
# body), so its SMS runs to several parts; the app's own notifications use
# MessageStructure=json with a short SMS.
# ---- BEGIN generated routes: Generated by scripts/sync-alert-rules.js from backend/src/alerts/catalogue.js. Do not edit.
# One route per alert: the receiver follows the severity (critical pages,
# the rest goes to chat) and repeat_interval is the catalogue's "repeat".
route:
  receiver: sns-chat
  group_by: [alertname]
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    - matchers: ['alertname="config.unsafe"']
      receiver: sns-alerts
      repeat_interval: 4h
    - matchers: ['alertname="secrets.load.fatal"']
      receiver: sns-alerts
      repeat_interval: 1h
    - matchers: ['alertname="secrets.fetch.failed"']
      receiver: sns-alerts
      repeat_interval: 1h
    - matchers: ['alertname="secrets.fetch.stale"']
      receiver: sns-chat
      repeat_interval: 1h
    - matchers: ['alertname="agent.forbidden"']
      receiver: sns-alerts
      repeat_interval: 1h
    - matchers: ['alertname="db.auth.rejected"']
      receiver: sns-chat
      repeat_interval: 30m
    - matchers: ['alertname="cache.auth.rejected"']
      receiver: sns-chat
      repeat_interval: 30m
    - matchers: ['alertname="cache.refresh.failed"']
      receiver: sns-alerts
      repeat_interval: 1h
    - matchers: ['alertname="secrets.reveal.enabled"']
      receiver: sns-chat
      repeat_interval: 24h
    - matchers: ['alertname="rotation.demo.failed"']
      receiver: sns-chat
      repeat_interval: 10m
    - matchers: ['alertname="app.errors.burst"']
      receiver: sns-chat
      repeat_interval: 1h
# ---- END generated routes

receivers:
  - name: sns-alerts
    sns_configs:
      - &sns # the same settings for both receivers; only the topic differs
        api_url: http://sns-logger:4575
        sigv4:
          region: us-east-1
          # dummy key: the local SNS reads the key ID as "who is publishing"
          access_key: local-alertmanager
          secret_key: local-mock
        subject: '[{{ .Status | toUpper }}] Secure Notes: {{ .CommonAnnotations.title }}'
        message: |-
          {{ range .Alerts -}}
          You are receiving this because the alert "{{ .Labels.alertname }}" is {{ $.Status | toUpper }}.

          Alert:       {{ .Labels.alertname }} ({{ .Labels.severity }})
          Description: {{ .Annotations.title }}
          Rule:        {{ .Annotations.rule }}
          Since:       {{ .StartsAt.UTC.Format "2006-01-02T15:04:05Z" }}
          Action:      {{ .Annotations.action }}
          Runbook:     {{ .Annotations.runbook }}
          Raised by:   vmalert on VictoriaLogs (local); on AWS, the CloudWatch alarm of the same name
          {{ end }}
        attributes:
          severity: '{{ .CommonLabels.severity }}'
        send_resolved: false
        topic_arn: arn:aws:sns:us-east-1:000000000000:secure-notes-ops-alerts
  - name: sns-chat
    sns_configs:
      - <<: *sns
        topic_arn: arn:aws:sns:us-east-1:000000000000:secure-notes-ops-chat
