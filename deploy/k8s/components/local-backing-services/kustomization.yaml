# Everything the app needs that AWS would normally provide, running inside the
# cluster: Postgres, Redis, the Secrets Manager mock and the one-shot seed job.
# For kind, OpenShift Local / a dev OpenShift cluster, or any Kubernetes cluster
# with no AWS access. Never use this component in production.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - aws-mock.yaml
  - postgres.yaml
  - redis.yaml
  - seed-job.yaml
  - networkpolicies.yaml

# Bootstrap passwords: used once by the seed job to log in, then replaced by
# random values stored only in Secrets Manager. After seeding they no longer
# work. They are not the app's credentials, and the app never reads them.
secretGenerator:
  - name: local-bootstrap
    literals:
      - pg-password=bootstrap-only-change-me
      - redis-password=bootstrap-only-change-me

configMapGenerator:
  - name: secure-notes-config
    behavior: merge
    literals:
      # Development mode: allows demo mode and the mock endpoint.
      - NODE_ENV=development
      - DEMO_MODE=true
      # The log shows which secret keys each client used, values masked.
      - LOG_LEVEL=debug
      - AWS_REGION=us-east-1
      - AWS_MOCK_ENDPOINT=http://aws-mock:4566
      # Dummy values: the AWS SDK signs requests even though the mock ignores
      # the signature. Real clusters use an IAM role (see the aws overlay).
      - AWS_ACCESS_KEY_ID=local-mock
      - AWS_SECRET_ACCESS_KEY=local-mock
      - DB_SECRET_ID=secure-notes/local/db
      - DB_ADMIN_SECRET_ID=secure-notes/local/db-admin
      - REDIS_SECRET_ID=secure-notes/local/redis
      - REDIS_ADMIN_SECRET_ID=secure-notes/local/redis-admin
