AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Secure Notes demo on EC2: Node.js app reading Postgres (RDS) and Redis
  (ElastiCache) credentials from AWS Secrets Manager with an instance role,
  IMDSv2, a VPC interface endpoint, a customer-managed KMS key and no inbound
  ports (access through SSM Session Manager port forwarding).

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  AppSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet for the instance. Needs outbound internet (NAT) to install packages.
  DataSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more private subnets in different AZs for RDS, ElastiCache and the VPC endpoint.
  AppArtifactBucket:
    Type: String
    Description: S3 bucket holding the app zip (see scripts/package.sh).
  AppArtifactKey:
    Type: String
    Default: secure-notes/app.zip
  SecretsMode:
    Type: String
    AllowedValues: [sdk, agent]
    Default: sdk
    Description: sdk = AWS SDK in the app; agent = AWS Workload Credentials Provider on localhost:2773.
  Environment:
    Type: String
    AllowedValues: [dev, uat, qa, prod]
    Default: dev
    Description: >-
      The {env} part of the secret naming convention: the Redis secret is named
      /elasticache/<Environment>/<stack name>/app (docs/reference/secret-naming.md).
  SecretAdminRoleArn:
    Type: String
    Default: ''
    Description: >-
      Optional role (arn:aws:iam::ACCOUNT:role/NAME) that may also read the Redis secret:
      a break-glass admin, or the CloudFormation service role if you deploy with one (it
      reads the secret when an update re-creates the cache user). Everyone else except
      the app and its rotation function is denied.
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional email for the alert topics (secret reads and critical app alarms; you confirm the subscription by email).
  AlertPhone:
    Type: String
    Default: ''
    AllowedPattern: '^$|^\+[1-9][0-9]{6,14}$'
    Description: Optional phone number (E.164, e.g. +15555550100) for SMS on secret reads and critical alarms. New accounts start in the SMS sandbox.
  AlertWebhookUrl:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://.+'
    Description: Optional https endpoint for every alert and notification (it must confirm the SNS subscription). For Slack or Teams, connect the topics in Amazon Q Developer in chat applications instead.
  EnableCloudWatchLogs:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Ship the app's (redacted) log to CloudWatch Logs with the CloudWatch agent, and alarm on it.
  CreateTrail:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >-
      The alarm needs CloudTrail recording management (read) events. Most accounts already
      have such a trail; set true only if yours does not.
  EnableConfigRules:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: true adds AWS Config rules for secret rotation and IMDSv2 (needs a Config recorder in the account).
  LogLevel:
    Type: String
    AllowedValues: [info, debug]
    Default: info
    Description: debug adds lines showing which secret keys the app used, values masked. (Revealing values is refused in production.)
  RedisRotationDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: Days between automatic rotations of the Redis (ElastiCache user) password.
  AwcpVersion:
    Type: String
    Default: 3.1.1
    Description: Workload Credentials Provider release (only used when SecretsMode=agent).
  CreateSecretsManagerEndpoint:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set to false if the VPC already has a Secrets Manager interface endpoint with private DNS.
  ExistingSecretsManagerEndpointId:
    Type: String
    Default: ''
    Description: Required when CreateSecretsManagerEndpoint=false (vpce-...). Used in the IAM condition.
  InstanceType:
    Type: String
    Default: t3.small
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  CacheNodeType:
    Type: String
    Default: cache.t4g.micro
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  MakeEndpoint: !Equals [!Ref CreateSecretsManagerEndpoint, 'true']
  HasSecretAdmin: !Not [!Equals [!Ref SecretAdminRoleArn, '']]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  HasAlertPhone: !Not [!Equals [!Ref AlertPhone, '']]
  HasWebhook: !Not [!Equals [!Ref AlertWebhookUrl, '']]
  ChatByEmail: !And [!Not [!Condition HasWebhook], !Condition HasAlertEmail]
  MakeLogs: !Equals [!Ref EnableCloudWatchLogs, 'true']
  MakeTrail: !Equals [!Ref CreateTrail, 'true']
  MakeConfigRules: !Equals [!Ref EnableConfigRules, 'true']

Resources:
  # ---------------------------------------------------------------- KMS ----
  SecretsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts Secure Notes secrets, RDS storage and ElastiCache data
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: kms:*
            Resource: '*'

  SecretsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-secrets
      TargetKeyId: !Ref SecretsKey

  # The alert topics need a customer-managed key: EventBridge and CloudWatch
  # alarms can't publish to a topic encrypted with the AWS-managed aws/sns key.
  AlertsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts the Secure Notes alert topics
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: kms:*
            Resource: '*'
          - Sid: EventBridgeAndAlarmsMayPublish
            Effect: Allow
            Principal: { Service: [events.amazonaws.com, cloudwatch.amazonaws.com] }
            Action: [kms:GenerateDataKey*, kms:Decrypt]
            Resource: '*'

  AlertsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-alerts
      TargetKeyId: !Ref AlertsKey

  # ------------------------------------------------------ security groups --
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Secure Notes app - no inbound; reached via SSM port forwarding
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: 'HTTPS: AWS APIs and packages' }

  AppToDbEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DbSecurityGroup

  AppToCacheEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      DestinationSecurityGroupId: !Ref CacheSecurityGroup

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Postgres - only from the app
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup }

  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis - only from the app
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 6379, ToPort: 6379, SourceSecurityGroupId: !Ref AppSecurityGroup }

  EndpointSecurityGroup:
    Condition: MakeEndpoint
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Secrets Manager interface endpoint - HTTPS from the app
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref AppSecurityGroup }

  # ------------------------------------------- Secrets Manager endpoint ----
  SecretsManagerEndpoint:
    Condition: MakeEndpoint
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcEndpointType: Interface
      PrivateDnsEnabled: true # the SDK's normal endpoint name resolves to this endpoint
      SubnetIds: !Ref DataSubnetIds
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Only principals of this account, only secrets of this account:
          # the endpoint cannot be used to read from or write to other accounts.
          - Effect: Allow
            Principal: '*'
            Action: secretsmanager:*
            Resource: '*'
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId
                aws:ResourceAccount: !Ref AWS::AccountId

  # ------------------------------------------------------------- secrets ----
  RedisAppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      # Naming convention /{service}/{env}/{resource}/{name}: IAM can grant a whole
      # environment with secret:/elasticache/prod/*, and the app builds the same name.
      Name: !Sub /elasticache/${Environment}/${AWS::StackName}/app
      Description: ElastiCache RBAC user for the app
      KmsKeyId: !Ref SecretsKey
      GenerateSecretString:
        SecretStringTemplate: '{"username": "notes-app"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true # ElastiCache passwords: 16-128 printable chars, some symbols disallowed

  # ------------------------------------------------------------------ RDS ----
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Secure Notes
      SubnetIds: !Ref DataSubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: '20'
      DBName: notes
      MasterUsername: notesadmin
      # RDS creates the secret in Secrets Manager and rotates it (managed rotation).
      # No password ever appears in this template, a parameter, or CI.
      ManageMasterUserPassword: true
      MasterUserSecret:
        KmsKeyId: !Ref SecretsKey
      StorageEncrypted: true
      KmsKeyId: !Ref SecretsKey
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      BackupRetentionPeriod: 1
      DeletionProtection: false # demo; turn on for real workloads

  # ---------------------------------------------------------- ElastiCache ----
  CacheDefaultUser:
    Type: AWS::ElastiCache::User
    Properties:
      UserId: !Sub ${AWS::StackName}-default
      UserName: default # every user group needs a "default" user; this one is disabled
      Engine: redis
      AccessString: off -@all
      NoPasswordRequired: true

  CacheAppUser:
    Type: AWS::ElastiCache::User
    Properties:
      UserId: !Sub ${AWS::StackName}-app
      UserName: notes-app
      Engine: redis
      # Least privilege: only keys under notes:*, no admin/dangerous commands.
      AccessString: on ~notes:* -@all +@read +@write +@connection -@dangerous +info
      AuthenticationMode:
        Type: password
        Passwords:
          # Dynamic reference: CloudFormation resolves it at deploy time and never shows the value.
          - !Sub '{{resolve:secretsmanager:${RedisAppSecret}:SecretString:password}}'

  CacheUserGroup:
    Type: AWS::ElastiCache::UserGroup
    Properties:
      UserGroupId: !Sub ${AWS::StackName}-users
      Engine: redis
      UserIds: [!Ref CacheDefaultUser, !Ref CacheAppUser]

  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Secure Notes
      SubnetIds: !Ref DataSubnetIds

  Cache:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: Secure Notes cache
      Engine: redis
      EngineVersion: '7.1'
      CacheNodeType: !Ref CacheNodeType
      NumCacheClusters: 1
      AutomaticFailoverEnabled: false
      TransitEncryptionEnabled: true
      AtRestEncryptionEnabled: true
      KmsKeyId: !Ref SecretsKey
      UserGroupIds: [!Ref CacheUserGroup]
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds: [!Ref CacheSecurityGroup]

  # ------------------------------------------------------------ IAM role ----
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-own-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read-only, only these two secrets, and only through our VPC endpoint:
              # role credentials stolen off the box are useless from anywhere else.
              - Sid: ReadAppSecretsViaVpce
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref RedisAppSecret
                Condition:
                  StringEquals:
                    aws:SourceVpce: !If [MakeEndpoint, !Ref SecretsManagerEndpoint, !Ref ExistingSecretsManagerEndpointId]
              # Decrypt with our key, but only when Secrets Manager asks on our behalf.
              - Sid: DecryptViaSecretsManagerOnly
                Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt SecretsKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
              - Sid: FetchAppArtifact
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${AppArtifactBucket}/${AppArtifactKey}
        - PolicyName: notify-and-ship-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The app's own notifications (credential rotated, test alert).
              - Sid: PublishNotifications
                Effect: Allow
                Action: sns:Publish
                Resource: [!Ref OpsAlertsTopic, !Ref OpsChatTopic]
              - Sid: EncryptForTheAlertTopics
                Effect: Allow
                Action: [kms:GenerateDataKey*, kms:Decrypt]
                Resource: !GetAtt AlertsKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub sns.${AWS::Region}.amazonaws.com
              # The CloudWatch agent ships /var/log/secure-notes/app.jsonl.
              - Sid: ShipAppLog
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/secure-notes/${AWS::StackName}/app:*
              - Sid: AgentLooksUpLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref AppRole]

  # ------------------------------------------------ Redis password rotation --
  # RDS rotates the database password itself. For the Redis user, Secrets
  # Manager calls this function on a schedule: it adds a new password next to
  # the old one (ElastiCache users accept two), moves AWSCURRENT, then retires
  # the old password. The app re-reads the secret on WRONGPASS, so no restart.
  # It only talks to the Secrets Manager and ElastiCache APIs, never to Redis,
  # so it needs no VPC access.
  RedisRotationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: rotate-redis-user
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ThisSecretOnly
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecretVersionStage
                Resource: !Ref RedisAppSecret
              - Sid: NewPasswords
                Effect: Allow
                Action: secretsmanager:GetRandomPassword
                Resource: '*'
              - Sid: ThisUserOnly
                Effect: Allow
                Action: [elasticache:DescribeUsers, elasticache:ModifyUser]
                Resource: !GetAtt CacheAppUser.Arn
              - Sid: KeyViaSecretsManagerOnly
                Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !GetAtt SecretsKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com

  RedisRotationLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-redis-rotation
      RetentionInDays: 30

  RedisRotationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-redis-rotation
      Description: Rotates the ElastiCache user password stored in the Redis secret
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt RedisRotationRole.Arn
      Timeout: 900 # each ElastiCache user change takes a few minutes to apply
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Ref RedisRotationLogs
      Environment:
        Variables:
          USER_ID: !Ref CacheAppUser
      Code:
        ZipFile: | # synced from infra/rotation/elasticache-user-rotation.js
          // Secrets Manager rotation for an ElastiCache RBAC user (inlined into
          // infra/cloudformation.yaml by scripts/sync-rotation-lambda.js; edit HERE).
          // ElastiCache users accept two passwords, so there is no moment when the app's
          // password stops working before it can fetch the new one.
          'use strict';
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const clients = () => {
            if (globalThis.__rotationClients) return globalThis.__rotationClients; // tests
            const { SecretsManager } = require('@aws-sdk/client-secrets-manager');
            const { ElastiCache } = require('@aws-sdk/client-elasticache');
            return { sm: new SecretsManager({}), ec: new ElastiCache({}) };
          };
          const read = async (sm, id, stage, token) =>
            JSON.parse((await sm.getSecretValue({ SecretId: id, VersionStage: stage, VersionId: token })).SecretString);

          async function settle(ec, userId) {
            const wait = Number(process.env.WAIT_MS || 10000);
            for (let i = 0; i < 60; i++) {
              const u = (await ec.describeUsers({ UserId: userId })).Users[0];
              if (u.Status === 'active') return u;
              await sleep(wait);
            }
            throw new Error(`user ${userId} still modifying`);
          }
          const setPasswords = async (ec, userId, passwords) => {
            await settle(ec, userId);
            await ec.modifyUser({ UserId: userId, AuthenticationMode: { Type: 'password', Passwords: passwords } });
            return settle(ec, userId);
          };

          exports.handler = async ({ SecretId: id, ClientRequestToken: token, Step: step }) => {
            const { sm, ec } = clients();
            const userId = process.env.USER_ID;
            const meta = await sm.describeSecret({ SecretId: id });
            if (!meta.RotationEnabled) throw new Error('rotation is not enabled');
            const stages = (meta.VersionIdsToStages || {})[token];
            if (!stages) throw new Error('unknown version');
            if (stages.includes('AWSCURRENT')) return; // already done
            if (!stages.includes('AWSPENDING')) throw new Error('version is not AWSPENDING');
            const current = await read(sm, id, 'AWSCURRENT');

            if (step === 'createSecret') {
              try {
                await read(sm, id, 'AWSPENDING', token);
              } catch (e) {
                if (e.name !== 'ResourceNotFoundException') throw e;
                const { RandomPassword } = await sm.getRandomPassword({ PasswordLength: 40, ExcludePunctuation: true });
                await sm.putSecretValue({ SecretId: id, ClientRequestToken: token,
                  SecretString: JSON.stringify({ ...current, password: RandomPassword }), VersionStages: ['AWSPENDING'] });
              }
            } else if (step === 'setSecret') {
              // Both passwords valid while the app catches up.
              const pending = await read(sm, id, 'AWSPENDING', token);
              await setPasswords(ec, userId, [current.password, pending.password]);
            } else if (step === 'testSecret') {
              const u = await settle(ec, userId);
              if (u.Authentication.Type !== 'password' || u.Authentication.PasswordCount < 2) throw new Error('new password not set');
            } else if (step === 'finishSecret') {
              const pending = await read(sm, id, 'AWSPENDING', token);
              const old = Object.keys(meta.VersionIdsToStages).find((v) => meta.VersionIdsToStages[v].includes('AWSCURRENT'));
              await sm.updateSecretVersionStage({ SecretId: id, VersionStage: 'AWSCURRENT', MoveToVersionId: token, RemoveFromVersionId: old });
              // Then retire the old password. A client still using it gets WRONGPASS on
              // its next login and re-reads the secret; open connections are unaffected.
              await setPasswords(ec, userId, [pending.password]);
            } else {
              throw new Error(`unknown step ${step}`);
            }
          };

  RedisRotationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RedisRotationFunction
      Action: lambda:InvokeFunction
      Principal: secretsmanager.amazonaws.com
      SourceArn: !Ref RedisAppSecret
      SourceAccount: !Ref AWS::AccountId

  RedisSecretRotation:
    Type: AWS::SecretsManager::RotationSchedule
    # The user must exist in the running cache before the first rotation.
    DependsOn: [Cache, RedisRotationPermission]
    Properties:
      SecretId: !Ref RedisAppSecret
      RotationLambdaARN: !GetAtt RedisRotationFunction.Arn
      RotateImmediatelyOnUpdate: false # not during the deploy; the first rotation is on schedule (or on demand)
      RotationRules:
        ScheduleExpression: !Sub rate(${RedisRotationDays} days)

  # ------------------------------------- E4 hardening: who may read secrets --
  # S4.1 A resource policy on the Redis secret: only the app role, the rotation
  # function and an optional break-glass role may read it, and the app only
  # through the VPC endpoint. Created AFTER the cache user, because CloudFormation
  # reads the secret once (as the deploying principal) to set that user's password.
  # (The RDS-managed secret keeps the app role's own IAM limits and the S4.2 alarm.)
  RedisSecretPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    DependsOn: CacheAppUser
    Properties:
      SecretId: !Ref RedisAppSecret
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: OnlyTheAppTheRotationFunctionAndBreakGlassMayRead
            Effect: Deny
            Principal: '*'
            Action: secretsmanager:GetSecretValue
            Resource: '*'
            Condition:
              ArnNotEquals:
                aws:PrincipalArn: !If
                  - HasSecretAdmin
                  - [!GetAtt AppRole.Arn, !GetAtt RedisRotationRole.Arn, !Ref SecretAdminRoleArn]
                  - [!GetAtt AppRole.Arn, !GetAtt RedisRotationRole.Arn]
              # A later stack update that re-creates the cache user reads the secret
              # through CloudFormation, with the deployer's own IAM permissions. That
              # read is still recorded, and the S4.2 alarm reports it.
              ForAllValues:StringNotEquals:
                aws:CalledVia: [cloudformation.amazonaws.com]
          - Sid: TheAppOnlyThroughTheVpcEndpoint
            Effect: Deny
            Principal: '*'
            Action: secretsmanager:GetSecretValue
            Resource: '*'
            Condition:
              ArnEquals:
                aws:PrincipalArn: !GetAtt AppRole.Arn
              StringNotEquals:
                aws:SourceVpce: !If [MakeEndpoint, !Ref SecretsManagerEndpoint, !Ref ExistingSecretsManagerEndpointId]

  # S4.2 Alarm when anyone other than the app or the rotation function reads
  # either secret: CloudTrail -> EventBridge -> SNS (email if AlertEmail is set).
  SecretReadAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Secure Notes security
      KmsMasterKeyId: !Ref AlertsKey # S12.1: not alias/aws/sns, which EventBridge can't use

  SecretReadAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref SecretReadAlertTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EventBridgeMayPublish
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref SecretReadAlertTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt SecretReadAlertRule.Arn

  SecretReadAlertEmail:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref SecretReadAlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  SecretReadAlertSms:
    Type: AWS::SNS::Subscription
    Condition: HasAlertPhone
    Properties:
      TopicArn: !Ref SecretReadAlertTopic
      Protocol: sms
      Endpoint: !Ref AlertPhone

  SecretReadAlertWebhook:
    Type: AWS::SNS::Subscription
    Condition: HasWebhook
    Properties:
      TopicArn: !Ref SecretReadAlertTopic
      Protocol: https
      Endpoint: !Ref AlertWebhookUrl

  # E12: alarms from the app's log. Critical ones page (email, SMS, chat);
  # warnings and the app's notifications go to chat only. The same split as
  # the local Alertmanager.
  OpsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Secure Notes
      KmsMasterKeyId: !Ref AlertsKey

  OpsChatTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Secure Notes
      KmsMasterKeyId: !Ref AlertsKey

  OpsTopicsPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref OpsAlertsTopic, !Ref OpsChatTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AlarmsInThisAccountMayPublish
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: [!Ref OpsAlertsTopic, !Ref OpsChatTopic]
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  OpsAlertsEmail:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties: { TopicArn: !Ref OpsAlertsTopic, Protocol: email, Endpoint: !Ref AlertEmail }

  OpsAlertsSms:
    Type: AWS::SNS::Subscription
    Condition: HasAlertPhone
    Properties: { TopicArn: !Ref OpsAlertsTopic, Protocol: sms, Endpoint: !Ref AlertPhone }

  OpsAlertsWebhook:
    Type: AWS::SNS::Subscription
    Condition: HasWebhook
    Properties: { TopicArn: !Ref OpsAlertsTopic, Protocol: https, Endpoint: !Ref AlertWebhookUrl }

  OpsChatWebhook:
    Type: AWS::SNS::Subscription
    Condition: HasWebhook
    Properties: { TopicArn: !Ref OpsChatTopic, Protocol: https, Endpoint: !Ref AlertWebhookUrl }

  # Without a chat endpoint, warnings still reach someone: by email.
  OpsChatEmail:
    Type: AWS::SNS::Subscription
    Condition: ChatByEmail
    Properties: { TopicArn: !Ref OpsChatTopic, Protocol: email, Endpoint: !Ref AlertEmail }

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: MakeLogs
    Properties:
      LogGroupName: !Sub /secure-notes/${AWS::StackName}/app
      RetentionInDays: 30

  # ---- BEGIN generated alarms: Generated by scripts/sync-alert-rules.js from backend/src/alerts/catalogue.js. Do not edit.
  ConfigUnsafeFilter:
    Type: AWS::Logs::MetricFilter
    Condition: MakeLogs
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '{ $.event = "config.unsafe" }'
      MetricTransformations:
        - MetricNamespace: !Sub SecureNotes/${AWS::StackName}
          MetricName: ConfigUnsafe
          MetricValue: '1'
          DefaultValue: 0
  ConfigUnsafeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: MakeLogs
    DependsOn: ConfigUnsafeFilter
    Properties:
      AlarmName: !Sub ${AWS::StackName}-config.unsafe
      AlarmDescription: '[critical] App refused to start: unsafe configuration. Read the log line: it lists each problem (a credential in the environment, a missing secret name, a lab flag in production). Fix the unit or ConfigMap and restart.'
      Namespace: !Sub SecureNotes/${AWS::StackName}
      MetricName: ConfigUnsafe
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]
      OKActions: [!Ref OpsAlertsTopic]
  SecretsLoadFatalFilter:
    Type: AWS::Logs::MetricFilter
    Condition: MakeLogs
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '{ $.event = "secrets.load.fatal" }'
      MetricTransformations:
        - MetricNamespace: !Sub SecureNotes/${AWS::StackName}
          MetricName: SecretsLoadFatal
          MetricValue: '1'
          DefaultValue: 0
  SecretsLoadFatalAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: MakeLogs
    DependsOn: SecretsLoadFatalFilter
    Properties:
      AlarmName: !Sub ${AWS::StackName}-secrets.load.fatal
      AlarmDescription: '[critical] App could not load its credentials and exited. Check the role can reach Secrets Manager (VPC endpoint, IAM, KMS) and that the secret names resolve. The app is down until it can read them.'
      Namespace: !Sub SecureNotes/${AWS::StackName}
      MetricName: SecretsLoadFatal
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]
      OKActions: [!Ref OpsAlertsTopic]
  SecretsFetchFailedFilter:
    Type: AWS::Logs::MetricFilter
    Condition: MakeLogs
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '{ $.event = "secrets.fetch.failed" }'
      MetricTransformations:
        - MetricNamespace: !Sub SecureNotes/${AWS::StackName}
          MetricName: SecretsFetchFailed
          MetricValue: '1'
          DefaultValue: 0
  SecretsFetchFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: MakeLogs
    DependsOn: SecretsFetchFailedFilter
    Properties:
      AlarmName: !Sub ${AWS::StackName}-secrets.fetch.failed
      AlarmDescription: '[critical] A credential could not be read from Secrets Manager. The app has no cached value to fall back on. Check IAM, the VPC endpoint, KMS and the secret name in the log line.'
      Namespace: !Sub SecureNotes/${AWS::StackName}
      MetricName: SecretsFetchFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]
      OKActions: [!Ref OpsAlertsTopic]
  SecretsFetchStaleFilter:
    Type: AWS::Logs::MetricFilter
    Condition: MakeLogs
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '{ $.event = "secrets.fetch.stale" }'
      MetricTransformations:
        - MetricNamespace: !Sub SecureNotes/${AWS::StackName}
          MetricName: SecretsFetchStale
          MetricValue: '1'
          DefaultValue: 0
  SecretsFetchStaleAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: MakeLogs
    DependsOn: SecretsFetchStaleFilter
    Properties:
      AlarmName: !Sub ${AWS::StackName}-secrets.fetch.stale
      AlarmDescription: '[warning] Serving a cached credential: Secrets Manager unreachable. The app keeps working on the last good value for up to SECRET_MAX_STALE_SECONDS. Find out why refreshes fail before that runs out.'
      Namespace: !Sub SecureNotes/${AWS::StackName}
      MetricName: SecretsFetchStale
      Statistic: Sum
      Period: 600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsChatTopic]
      OKActions: [!Ref OpsChatTopic]
  AgentForbiddenFilter:
    Type: AWS::Logs::MetricFilter
    Condition: MakeLogs
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '{ $.event = "agent.forbidden" }'
      MetricTransformations:
        - MetricNamespace: !Sub SecureNotes/${AWS::StackName}
          MetricName: AgentForbidden
          MetricValue: '1'
          DefaultValue: 0
  AgentForbiddenAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: MakeLogs
    DependsOn: AgentForbiddenFilter
    Properties:
      AlarmName: !Sub ${AWS::StackName}-agent.forbidden
      AlarmDescription: '[critical] The local credentials agent refused the app. The agent answered 403: the app is not sending its SSRF token, or the token file is unreadable. Check the token file and group membership.'
      Namespace: !Sub SecureNotes/${AWS::StackName}
      MetricName: AgentForbidden
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]
      OKActions: [!Ref OpsAlertsTopic]
  DbAuthRejectedFilter:
    Type: AWS::Logs::MetricFilter
    Condition: MakeLogs
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '{ $.event = "db.auth.rejected" }'
      MetricTransformations:
        - MetricNamespace: !Sub SecureNotes/${AWS::StackName}
          MetricName: DbAuthRejected
          MetricValue: '1'
          DefaultValue: 0
  DbAuthRejectedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: MakeLogs
    DependsOn: DbAuthRejectedFilter
    Properties:
      AlarmName: !Sub ${AWS::StackName}-db.auth.rejected
      AlarmDescription: '[warning] Postgres rejected the cached password. Usually a rotation the app recovers from by itself (look for db.auth.recovered). Repeated rejections mean the secret and the database disagree.'
      Namespace: !Sub SecureNotes/${AWS::StackName}
      MetricName: DbAuthRejected
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsChatTopic]
      OKActions: [!Ref OpsChatTopic]
  CacheAuthRejectedFilter:
    Type: AWS::Logs::MetricFilter
    Condition: MakeLogs
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '{ $.event = "cache.auth.rejected" }'
      MetricTransformations:
        - MetricNamespace: !Sub SecureNotes/${AWS::StackName}
          MetricName: CacheAuthRejected
          MetricValue: '1'
          DefaultValue: 0
  CacheAuthRejectedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: MakeLogs
    DependsOn: CacheAuthRejectedFilter
    Properties:
      AlarmName: !Sub ${AWS::StackName}-cache.auth.rejected
      AlarmDescription: '[warning] Redis rejected the cached password. Usually a rotation the app recovers from by itself (look for cache.auth.recovered). Repeated rejections mean the secret and the Redis user disagree.'
      Namespace: !Sub SecureNotes/${AWS::StackName}
      MetricName: CacheAuthRejected
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsChatTopic]
      OKActions: [!Ref OpsChatTopic]
  CacheRefreshFailedFilter:
    Type: AWS::Logs::MetricFilter
    Condition: MakeLogs
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '{ $.event = "cache.refresh.failed" }'
      MetricTransformations:
        - MetricNamespace: !Sub SecureNotes/${AWS::StackName}
          MetricName: CacheRefreshFailed
          MetricValue: '1'
          DefaultValue: 0
  CacheRefreshFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: MakeLogs
    DependsOn: CacheRefreshFailedFilter
    Properties:
      AlarmName: !Sub ${AWS::StackName}-cache.refresh.failed
      AlarmDescription: '[critical] Redis credential refresh failed. Redis rejected the password and the app could not read a new one. Check Secrets Manager access and the rotation function.'
      Namespace: !Sub SecureNotes/${AWS::StackName}
      MetricName: CacheRefreshFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]
      OKActions: [!Ref OpsAlertsTopic]
  SecretsRevealEnabledFilter:
    Type: AWS::Logs::MetricFilter
    Condition: MakeLogs
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '{ $.event = "secrets.reveal.enabled" }'
      MetricTransformations:
        - MetricNamespace: !Sub SecureNotes/${AWS::StackName}
          MetricName: SecretsRevealEnabled
          MetricValue: '1'
          DefaultValue: 0
  SecretsRevealEnabledAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: MakeLogs
    DependsOn: SecretsRevealEnabledFilter
    Properties:
      AlarmName: !Sub ${AWS::StackName}-secrets.reveal.enabled
      AlarmDescription: '[warning] Secret values are being written to the log (lab flag on). LOG_REVEAL_SECRETS=true is for labs. Turn it off and treat the values in this log as exposed.'
      Namespace: !Sub SecureNotes/${AWS::StackName}
      MetricName: SecretsRevealEnabled
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsChatTopic]
      OKActions: [!Ref OpsChatTopic]
  RotationDemoFailedFilter:
    Type: AWS::Logs::MetricFilter
    Condition: MakeLogs
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '{ $.event = "rotation.demo.failed" }'
      MetricTransformations:
        - MetricNamespace: !Sub SecureNotes/${AWS::StackName}
          MetricName: RotationDemoFailed
          MetricValue: '1'
          DefaultValue: 0
  RotationDemoFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: MakeLogs
    DependsOn: RotationDemoFailedFilter
    Properties:
      AlarmName: !Sub ${AWS::StackName}-rotation.demo.failed
      AlarmDescription: '[warning] A demo rotation failed. Demo only. The log line names the step that failed.'
      Namespace: !Sub SecureNotes/${AWS::StackName}
      MetricName: RotationDemoFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsChatTopic]
      OKActions: [!Ref OpsChatTopic]
  AppErrorsBurstFilter:
    Type: AWS::Logs::MetricFilter
    Condition: MakeLogs
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '{ ($.level = "error") && ($.msg != "simulated:*") }'
      MetricTransformations:
        - MetricNamespace: !Sub SecureNotes/${AWS::StackName}
          MetricName: AppErrorsBurst
          MetricValue: '1'
          DefaultValue: 0
  AppErrorsBurstAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: MakeLogs
    DependsOn: AppErrorsBurstFilter
    Properties:
      AlarmName: !Sub ${AWS::StackName}-app.errors.burst
      AlarmDescription: '[warning] Burst of errors in the app log. Look at the error lines in the log store for the same five minutes.'
      Namespace: !Sub SecureNotes/${AWS::StackName}
      MetricName: AppErrorsBurst
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsChatTopic]
      OKActions: [!Ref OpsChatTopic]
  # ---- END generated alarms

  SecretReadAlertRule:
    Type: AWS::Events::Rule
    DependsOn: CacheAppUser # starts after the stack's own one-time read of the Redis secret
    Properties:
      Description: A Secure Notes secret was read by someone other than the app or its rotation function
      # GetSecretValue is a read-only management event: EventBridge delivers
      # those only to rules in this state (a plain ENABLED rule never fires).
      State: ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS
      EventPattern:
        source: [aws.secretsmanager]
        detail-type: [AWS API Call via CloudTrail]
        # (GetSecretValue names one secret in secretId; BatchGetSecretValue lists
        # them in secretIdList) x (a role session other than the app and rotation
        # roles, or a user or root, which has no role session at all).
        # The RDS secret is matched by ARN: a read that names it by name or partial
        # ARN is still in CloudTrail but doesn't raise this alarm.
        detail:
          eventSource: [secretsmanager.amazonaws.com]
          eventName: [GetSecretValue, BatchGetSecretValue]
          $or:
          - requestParameters:
              secretId:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref RedisAppSecret
                  - !Sub /elasticache/${Environment}/${AWS::StackName}/app
            userIdentity:
              sessionContext:
                sessionIssuer:
                  arn:
                    - anything-but: [!GetAtt AppRole.Arn, !GetAtt RedisRotationRole.Arn]
          - requestParameters:
              secretId:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref RedisAppSecret
                  - !Sub /elasticache/${Environment}/${AWS::StackName}/app
            userIdentity:
              type: [IAMUser, Root, FederatedUser, IdentityCenterUser]
          - requestParameters:
              secretIdList:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref RedisAppSecret
                  - !Sub /elasticache/${Environment}/${AWS::StackName}/app
            userIdentity:
              sessionContext:
                sessionIssuer:
                  arn:
                    - anything-but: [!GetAtt AppRole.Arn, !GetAtt RedisRotationRole.Arn]
          - requestParameters:
              secretIdList:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref RedisAppSecret
                  - !Sub /elasticache/${Environment}/${AWS::StackName}/app
            userIdentity:
              type: [IAMUser, Root, FederatedUser, IdentityCenterUser]
      Targets:
        - Id: alert
          Arn: !Ref SecretReadAlertTopic
          InputTransformer:
            InputPathsMap:
              secret: $.detail.requestParameters.secretId
              who: $.detail.userIdentity.arn
              from: $.detail.sourceIPAddress
              when: $.detail.eventTime
            InputTemplate: '"Secure Notes: secret <secret> was read by <who> from <from> at <when>. If this was not you, investigate."'

  # Optional trail, only for accounts without one recording read management events.
  TrailBucket:
    Type: AWS::S3::Bucket
    Condition: MakeTrail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-trail-logs
            Status: Enabled
            ExpirationInDays: 90

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: MakeTrail
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-trail
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub ${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-trail
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt TrailBucket.Arn, !Sub '${TrailBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  Trail:
    Type: AWS::CloudTrail::Trail
    Condition: MakeTrail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Sub ${AWS::StackName}-trail
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: false
      EnableLogFileValidation: true
      IncludeGlobalServiceEvents: true
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true

  # S4.3 AWS Config managed rules (needs a Config recorder in the account).
  RotationEnabledRule:
    Type: AWS::Config::ConfigRule
    Condition: MakeConfigRules
    Properties:
      ConfigRuleName: !Sub ${AWS::StackName}-secretsmanager-rotation-enabled
      Description: Every secret has rotation enabled
      Scope: { ComplianceResourceTypes: [AWS::SecretsManager::Secret] }
      Source: { Owner: AWS, SourceIdentifier: SECRETSMANAGER_ROTATION_ENABLED_CHECK }

  RotationSucceededRule:
    Type: AWS::Config::ConfigRule
    Condition: MakeConfigRules
    Properties:
      ConfigRuleName: !Sub ${AWS::StackName}-secretsmanager-rotation-succeeded
      Description: The last scheduled rotation of every secret succeeded
      Scope: { ComplianceResourceTypes: [AWS::SecretsManager::Secret] }
      Source: { Owner: AWS, SourceIdentifier: SECRETSMANAGER_SCHEDULED_ROTATION_SUCCESS_CHECK }

  ImdsV2Rule:
    Type: AWS::Config::ConfigRule
    Condition: MakeConfigRules
    Properties:
      ConfigRuleName: !Sub ${AWS::StackName}-ec2-imdsv2
      Description: EC2 instances require IMDSv2 (session tokens)
      Scope: { ComplianceResourceTypes: [AWS::EC2::Instance] }
      Source: { Owner: AWS, SourceIdentifier: EC2_IMDSV2_CHECK }

  # ------------------------------------------------------------ instance ----
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required # IMDSv2 only: blocks SSRF theft of role credentials
          HttpPutResponseHopLimit: 1 # token cannot leave the host (e.g. into containers)
          HttpEndpoint: enabled
          InstanceMetadataTags: disabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true }

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref AppSubnetId
      SecurityGroupIds: [!Ref AppSecurityGroup]
      IamInstanceProfile: !Ref AppInstanceProfile
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-app' }
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euo pipefail
            dnf install -y nodejs22 nodejs22-npm unzip
            alternatives --set node /usr/bin/node-22 || true

            # Dedicated, non-login service user. Code is owned by root and only readable by the app.
            useradd --system --home-dir /opt/secure-notes --shell /sbin/nologin securenotes || true
            mkdir -p /opt/secure-notes /etc/secure-notes
            aws s3 cp "s3://${AppArtifactBucket}/${AppArtifactKey}" /tmp/app.zip
            unzip -oq /tmp/app.zip -d /opt/secure-notes && rm -f /tmp/app.zip
            (cd /opt/secure-notes/backend && npm-22 install --omit=dev --no-audit --no-fund)

            # RDS CA bundle so the app can verify the database certificate.
            curl -fsSL -o /opt/secure-notes/rds-global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem

            chown -R root:securenotes /opt/secure-notes
            chmod -R u=rwX,g=rX,o= /opt/secure-notes

            if [ "${SecretsMode}" = "agent" ]; then
              cat > /etc/secure-notes/awcp.toml <<'TOML'
            [capabilities.secrets_manager]
            http_port = 2773
            [capabilities.secrets_manager.cache]
            ttl_seconds = 300
            TOML
              installer=$(mktemp)
              curl --proto '=https' --tlsv1.2 -fsSL -o "$installer" \
                https://raw.githubusercontent.com/aws/aws-workload-credentials-provider/HEAD/install.sh
              AWCP_VERSION=${AwcpVersion} bash "$installer" --config /etc/secure-notes/awcp.toml
              rm -f "$installer"
              usermod -aG aws-wcp-token securenotes
            fi

            # Non-secret configuration only: IDs and hostnames.
            cat > /etc/secure-notes/app.env <<ENV
            NODE_ENV=production
            AWS_REGION=${AWS::Region}
            SECRETS_MODE=${SecretsMode}
            LOG_LEVEL=${LogLevel}
            DB_SECRET_ID=${DbSecretArn}
            DB_HOST=${DbHost}
            DB_PORT=${DbPort}
            DB_NAME=notes
            DB_AUTO_MIGRATE=true
            DB_SSL=true
            DB_SSL_CA_FILE=/opt/secure-notes/rds-global-bundle.pem
            # The Redis secret's name is built from the naming convention:
            # /elasticache/${Environment}/${AWS::StackName}/app. The RDS secret keeps
            # its explicit ARN, because RDS names it (rds!db-…) itself.
            SECRETS_ENV=${Environment}
            REDIS_SECRET_RESOURCE=${AWS::StackName}
            REDIS_HOST=${CacheHost}
            REDIS_PORT=${CachePort}
            REDIS_TLS=true
            # Notifications (the app's own) and the log copy the CloudWatch agent ships.
            SNS_TOPIC_ARN=${OpsAlertsTopic}
            SNS_CHAT_TOPIC_ARN=${OpsChatTopic}
            LOG_FILE=/var/log/secure-notes/app.jsonl
            ENV
            chown root:securenotes /etc/secure-notes/app.env
            chmod 640 /etc/secure-notes/app.env

            cp /opt/secure-notes/infra/systemd/secure-notes.service /etc/systemd/system/
            if [ "${SecretsMode}" = "agent" ]; then
              mkdir -p /etc/systemd/system/secure-notes.service.d
              printf '[Service]\nSupplementaryGroups=aws-wcp-token\n' > /etc/systemd/system/secure-notes.service.d/agent.conf
            fi
            systemctl daemon-reload
            systemctl enable --now secure-notes

            # Logs first, then alerts: the CloudWatch agent ships the app's redacted
            # JSON log to CloudWatch Logs, where metric filters raise the alarms.
            if [ "${EnableCloudWatchLogs}" = "true" ]; then
              dnf install -y amazon-cloudwatch-agent logrotate
              cat > /opt/aws/amazon-cloudwatch-agent/etc/secure-notes.json <<'CWA'
            {
              "agent": { "run_as_user": "root" },
              "logs": {
                "logs_collected": {
                  "files": {
                    "collect_list": [
                      { "file_path": "/var/log/secure-notes/app.jsonl", "log_group_name": "/secure-notes/STACK/app", "log_stream_name": "{instance_id}" }
                    ]
                  }
                }
              }
            }
            CWA
              sed -i "s|/secure-notes/STACK/app|/secure-notes/${AWS::StackName}/app|" /opt/aws/amazon-cloudwatch-agent/etc/secure-notes.json
              printf '/var/log/secure-notes/app.jsonl {\n  daily\n  rotate 3\n  compress\n  missingok\n  copytruncate\n}\n' > /etc/logrotate.d/secure-notes
              /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/secure-notes.json
            fi
          - DbSecretArn: !GetAtt Database.MasterUserSecret.SecretArn
            DbHost: !GetAtt Database.Endpoint.Address
            DbPort: !GetAtt Database.Endpoint.Port
            CacheHost: !GetAtt Cache.PrimaryEndPoint.Address
            CachePort: !GetAtt Cache.PrimaryEndPoint.Port

Outputs:
  InstanceId:
    Value: !Ref AppInstance
  OpenTheApp:
    Description: Run locally, then browse to http://localhost:3000
    Value: !Sub >-
      aws ssm start-session --target ${AppInstance} --document-name AWS-StartPortForwardingSession
      --parameters '{"portNumber":["3000"],"localPortNumber":["3000"]}'
  DbSecretArn:
    Description: RDS-managed secret (rotated by RDS)
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  RedisSecretArn:
    Description: Redis user secret (rotated by RedisRotationFunction)
    Value: !Ref RedisAppSecret
  KmsKeyArn:
    Value: !GetAtt SecretsKey.Arn
  OpsAlertsTopicArn:
    Description: Critical app alarms and the test alert (email, SMS, chat)
    Value: !Ref OpsAlertsTopic
  OpsChatTopicArn:
    Description: Warnings and the app's notifications (chat; email if no webhook)
    Value: !Ref OpsChatTopic
  AppLogGroupName:
    Condition: MakeLogs
    Value: !Ref AppLogGroup
  SecretReadAlertTopicArn:
    Description: Subscribe here (email, chat, pager) to hear about unexpected secret reads
    Value: !Ref SecretReadAlertTopic
